name: tai-reference

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - tools/reference-scn001
          - tools/reference-mmi-readonly
          - tools/reference-sei-decision
          - tools/reference-scn001-run
          - tools/reference-scn001-render
          - tools/reference-tei-model
          - tools/reference-publication-gate
          - tools/reference-sui-link
          - tools/reference-sui-draft
          - tools/reference-eki-cli
          - tools/reference-harness-boundary
    defaults:
      run:
        working-directory: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  python-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/reference-sui-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SUI probe test
        run: python -m unittest -v probe_test.py
      - name: EKI API probe test
        working-directory: tools/reference-eki-api
        run: python -m unittest -v probe_test.py submit_test.py cancel_test.py
      - name: public boundary test
        working-directory: tools/check-public-boundary
        run: python -m unittest -v check_test.py
      - name: public boundary scan
        working-directory: .
        run: python tools/check-public-boundary/check.py --root .
      - name: SUI live-stub visibility observer unit tests
        working-directory: integrations/pilot-sui-document/assembler
        run: python -m unittest -v test_context_bundle_visibility.py
      - name: YI 64-hexagram audit regression tests
        working-directory: .
        run: python -m unittest -v evaluations/test_yi_constellation_audit.py
      - name: YI 64-hexagram structural audit
        working-directory: .
        run: python evaluations/audit-yi-constellation.py
      - name: synthetic facility test
        working-directory: tools/reference-synthetic-facility
        run: python -m unittest -v check_test.py
      - name: synthetic facility scan
        working-directory: .
        run: python tools/reference-synthetic-facility/check.py --root scenarios/SCN-001-synthetic-facility
      - name: synthetic receipts test
        working-directory: tools/check-synthetic-receipts
        run: python -m unittest -v check_test.py
      - name: synthetic receipts scan
        working-directory: .
        run: python tools/check-synthetic-receipts/check.py --root .
      - name: document consistency
        working-directory: .
        run: python integrations/tools/doc_consistency_check.py
      - name: PoC evaluation template
        working-directory: .
        run: python integrations/tools/poc_evaluation_template_check.py
      - name: synthetic flow test
        working-directory: tools/check-synthetic-flow
        run: python -m unittest -v check_test.py
      - name: synthetic flow scan
        working-directory: .
        run: python tools/check-synthetic-flow/check.py --root .
      - name: synthetic variants test
        working-directory: tools/check-synthetic-variants
        run: python -m unittest -v check_test.py
      - name: synthetic variants scan
        working-directory: .
        run: python tools/check-synthetic-variants/check.py --root .
      - name: synthetic negative test
        working-directory: tools/check-synthetic-negative
        run: python -m unittest -v check_test.py
      - name: synthetic negative scan
        working-directory: .
        run: python tools/check-synthetic-negative/check.py --root .
      - name: synthetic contract test
        working-directory: tools/check-synthetic-contract
        run: python -m unittest -v check_test.py
      - name: synthetic contract scan
        working-directory: .
        run: python tools/check-synthetic-contract/check.py --root .
      - name: SEI negative test
        working-directory: tools/reference-sei-negative
        run: python -m unittest -v check_test.py
      - name: SEI negative scan
        working-directory: .
        run: python tools/reference-sei-negative/check.py --root .
      - name: synthetic process test
        working-directory: tools/check-synthetic-process
        run: python -m unittest -v check_test.py
      - name: synthetic process scan
        working-directory: .
        run: python tools/check-synthetic-process/check.py --root .
      - name: SCN-002 slice test
        working-directory: tools/check-scn002
        run: python -m unittest -v check_test.py
      - name: SCN-002 slice scan
        working-directory: .
        run: python tools/check-scn002/check.py --root .
      - name: cross-scenario test
        working-directory: tools/check-cross-scenario
        run: python -m unittest -v check_test.py
      - name: cross-scenario scan
        working-directory: .
        run: python tools/check-cross-scenario/check.py --root .
      - name: SCN-003 slice test
        working-directory: tools/check-scn003
        run: python -m unittest -v check_test.py
      - name: SCN-003 slice scan
        working-directory: .
        run: python tools/check-scn003/check.py --root .
      - name: multi-scenario review test
        working-directory: tools/check-multi-scenario-review
        run: python -m unittest -v check_test.py
      - name: multi-scenario review scan
        working-directory: .
        run: python tools/check-multi-scenario-review/check.py --root .
      - name: TEI capability chain test
        working-directory: tools/check-tei-contracts
        run: python -m unittest -v check_test.py
      - name: TEI capability chain scan
        working-directory: .
        run: python tools/check-tei-contracts/check.py --root .

  # Explicitly pinned, public SUI checkout. This runs the local-dev HTTP
  # API against its fixed synthetic stub; it is NOT a real-user-data test.
  sui-context-live-stub:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout TAI candidate
        uses: actions/checkout@v4
        with:
          path: tai
          persist-credentials: false
      - name: Checkout pinned public SUI source
        uses: actions/checkout@v4
        with:
          repository: hat47x/sui-sensemaking
          ref: a828a0154db3201322ed27d006c035d9784866a8
          path: sui
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sui/03_Implement/backend/requirements-test.lock
      - name: Check exact SUI source revision
        run: |
          test "$(git -C sui rev-parse HEAD)" = "a828a0154db3201322ed27d006c035d9784866a8"
          test -z "$(git -C sui status --porcelain)"
      - name: Install pinned SUI backend dependencies
        run: |
          python -m pip install -r sui/03_Implement/backend/requirements-test.lock
          python -m pip install --no-deps -e sui/03_Implement/backend
      - name: Exercise real local-dev SUI HTTP with synthetic A2 stub
        run: |
          python tai/integrations/pilot-sui-document/assembler/context_bundle_check.py \
            --sui-repo "$GITHUB_WORKSPACE/sui" \
            --artifact "$GITHUB_WORKSPACE/tai/evaluations/artifacts/scn-003-document.json" \
            --out "$RUNNER_TEMP/sui-context-live-stub-receipt.json"
      # Do not upload the receipt automatically. The observer prints aggregate
      # counts only and never certifies disclosure rights or source identity.
