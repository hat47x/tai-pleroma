name: tai-reference

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool:
          - tools/reference-scn001
          - tools/reference-mmi-readonly
          - tools/reference-sei-decision
          - tools/reference-scn001-run
          - tools/reference-scn001-render
          - tools/reference-tei-model
          - tools/reference-publication-gate
    defaults:
      run:
        working-directory: ${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  python-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/reference-sui-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: probe test
        run: python -m unittest -v probe_test.py
