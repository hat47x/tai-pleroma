name: codex-c1-format-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format C1 sources and report canonical Go source
        shell: bash
        run: |
          gofmt -w integrations/harness-adapter/codex_exec.go integrations/harness-adapter/codex_exec_test.go
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, path in [('CODEX_GO','integrations/harness-adapter/codex_exec.go'), ('CODEX_TEST','integrations/harness-adapter/codex_exec_test.go')]:
              print('FORMATTED_' + name + '=' + json.dumps(Path(path).read_text()))
          PY
